# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
	${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "mangopi-layer"
BBFILE_PATTERN_mangopi-layer = "^${LAYERDIR}/"

# Least priority for this layer
BBFILE_PRIORITY_mangopi-layer = "7"

LAYERSERIES_COMPAT_mangopi-layer = "scarthgap"