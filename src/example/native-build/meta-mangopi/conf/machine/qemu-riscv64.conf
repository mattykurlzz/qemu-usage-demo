#@TYPE: Machine
#@NAME: qemu-riscv64
#@SOC: RISC-V 64-bit (generic)
#@DESCRIPTION: Machine configuration for running a generic RISC-V 64-bit image
#              under QEMU (the 'virt' machine).
#
# This machine is a barebone adaptation of the mangopi-mq-pro setup for QEMU.
# It reuses the same RISC-V 64-bit toolchain (via riscv-common.inc) so the image
# is compiled with the exact same cross-compiler as the MangoPi build. Only the
# QEMU-specific bits differ: the kernel is built for the QEMU 'virt' machine
# (generic RISC-V defconfig, direct kernel boot) instead of the Allwinner D1.

require conf/machine/include/riscv-common.inc

#============================================
# Kernel Configuration
#
# The QEMU 'virt' machine is a generic RISC-V platform. Use the mainline kernel
# built with the generic RISC-V defconfig and boot it directly (Image), without
# a FIT image or a bundled device tree: QEMU generates the device tree for the
# 'virt' machine at runtime.
PREFERRED_PROVIDER_virtual/kernel = "linux-qemu"
KERNEL_IMAGETYPE = "Image"
KERNEL_CLASSES = ""
#============================================

#============================================
# Image Configuration
#
# For QEMU we only need the ext4 root filesystem (and a qcow2 wic image for
# convenience). The wic.gz / wic.bmap and the boot files from riscv-common.inc
# are not needed for direct kernel boot under QEMU.
IMAGE_FSTYPES:remove = "wic.gz wic.bmap"
IMAGE_FSTYPES += "wic.qcow2"
IMAGE_BOOT_FILES = ""
#============================================

#============================================
# Serial Console
#
# The QEMU 'virt' machine exposes the console on ttyS0 (and hvc0 via virtio).
SERIAL_CONSOLES = "115200;ttyS0 115200;hvc0"
#============================================

#============================================
# qemuboot options (used by runqemu)
#
# Boot flow: OpenSBI (fw_jump) loads the kernel Image. QEMU provides the DTB.
IMAGE_CLASSES += "qemuboot"
QB_MACHINE = "-machine virt"
QB_SMP = "-smp 4"
QB_DEFAULT_BIOS = "fw_jump.elf"
QB_KERNEL_CMDLINE_APPEND = "earlycon=sbi"
QB_TAP_OPT = "-netdev tap,id=net0,ifname=@TAP@,script=no,downscript=no"
QB_NETWORK_DEVICE = "-device virtio-net-device,netdev=net0,mac=@MAC@"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-device,drive=disk0"
QB_SERIAL_OPT = "-device virtio-serial-device -chardev null,id=virtcon -device virtconsole,chardev=virtcon"
QB_TCPSERIAL_OPT = " -device virtio-serial-device -chardev socket,id=virtcon,port=@PORT@,host=127.0.0.1,nodelay=on -device virtconsole,chardev=virtcon"
QB_OPT_APPEND = "-device qemu-xhci -device usb-tablet -device usb-kbd"
#============================================